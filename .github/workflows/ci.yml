name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest

    steps:
      # v4 of these actions bundles a Node 20 runtime, which the runners now warn
      # about and force onto Node 24. v7 ships a Node 24 runtime natively.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches engines.node, which is pinned so a new major cannot arrive
          # unannounced and break the build.
          node-version: 24
          cache: npm

      # ci, not install: fails if package-lock.json and package.json disagree,
      # which is exactly what you want a pipeline to catch.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm run test

      # Last, because it is the slowest and the checks above localise failures
      # far better than a build error does.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
